<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="data/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="data/icon_180.png">
<title>게시판 · 사업나침반</title>
<meta name="description" content="기업지원정보와 서비스 개선의견을 나누는 게시판입니다.">
<style>
:root{
  --bg-page:#F8FAFC; --bg-surface:#FFFFFF; --bg-muted:#F1F5F9; --bg-accent:#EFF6FF;
  --text:#0F172A; --text-2:#475569; --text-3:#64748B; --text-accent:#2563EB; --blue-700:#1D4ED8;
  --border:#E2E8F0; --border-strong:#CBD5E1; --r-md:10px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg-page);color:var(--text);
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;
  font-size:15px;line-height:1.6;word-break:keep-all}
.wrap{max-width:900px;margin:0 auto;padding:0 20px}
.gnb{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.gnb .wrap{display:flex;align-items:center;gap:20px;height:64px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;text-decoration:none;color:var(--text);white-space:nowrap}
.logo i{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--text-accent);color:#fff;font-style:normal;font-size:14px}
.gnb .crumb{flex:1;font-size:14px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gnb .crumb a{text-decoration:none;color:var(--text-2)}
.btn{display:inline-block;background:var(--text-accent);color:#fff;font-weight:600;font-size:14px;border-radius:8px;padding:9px 16px;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--blue-700)}
.head{padding:44px 0 20px;background:linear-gradient(var(--bg-surface),var(--bg-page))}
.head h1{font-size:28px;margin:0 0 8px}
.lead{color:var(--text-2);margin:0}
.tools{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:8px 0 16px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--border);background:#fff;border-radius:999px;font:inherit;font-size:13px;font-weight:500;color:var(--text-2);padding:5px 14px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--text-accent);border-color:var(--text-accent);color:#fff}
.post.focus{border-color:var(--text-accent);box-shadow:0 0 0 1px var(--text-accent)}
.more{display:block;width:100%;border:1px solid var(--border-strong);background:#fff;border-radius:var(--r-md);font:inherit;font-weight:600;color:var(--text-2);padding:10px;cursor:pointer}
.post{scroll-margin-top:80px;background:#fff;border:1px solid var(--border);border-radius:var(--r-md);margin-bottom:10px}
.post summary{list-style:none;cursor:pointer;padding:14px 18px;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:baseline}
.post summary::-webkit-details-marker{display:none}
.post .tag{font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;background:var(--bg-muted);color:var(--text-2);white-space:nowrap}
.post .tag.info{background:var(--bg-accent);color:var(--blue-700)}
.post .title{font-weight:600;overflow-wrap:anywhere}
.post .meta{grid-column:2;font-size:12.5px;color:var(--text-3)}
.post .body{padding:0 18px 16px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text-2)}
.post .body a{color:var(--text-accent)}
.post .answer{margin:0 18px 16px;padding:12px 14px;background:var(--bg-accent);border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere}
.post .answer b{display:block;font-size:13px;color:var(--blue-700);margin-bottom:2px}
.empty{padding:36px 18px;text-align:center;color:var(--text-3);background:#fff;border:1px dashed var(--border-strong);border-radius:var(--r-md)}
.note{font-size:12.5px;color:var(--text-3);margin:20px 0 48px}
@media (max-width:640px){
  .gnb .wrap{gap:10px}
  .gnb .crumb{display:none}
  .logo{flex:1}
  .head{padding:28px 0 14px}
  .head h1{font-size:24px}
  .tools .btn{width:100%;text-align:center}
  .post summary{padding:12px 14px}
  .post .body{padding:0 14px 14px}
  .post .answer{margin:0 14px 14px}
}
</style>
</head>
<body>
<header class="gnb">
  <div class="wrap">
    <a class="logo" href="index.html"><img src="data/icon.svg" width="28" height="28" alt="" style="flex:none">사업나침반</a>
    <span class="crumb"><a href="index.html">홈</a> › 게시판</span>
    <a class="btn" href="https://app.biznachim.kr">로그인·가입</a>
  </div>
</header>

<div class="head">
  <div class="wrap">
    <h1>게시판</h1>
    <p class="lead">기업지원정보와 서비스 개선의견을 나누는 곳입니다. 회원 글은 운영자가 확인한 뒤 공개되고, 게시자 별칭은 첫 글자만 보입니다.</p>
  </div>
</div>

<main class="wrap">
  <div class="tools">
    <div class="chips" id="chips" role="group" aria-label="구분"></div>
    <a class="btn" href="https://app.biznachim.kr/board">로그인하고 글쓰기</a>
  </div>
  <div id="list"></div>
  <p class="note">오류·장애는 로그인 후 프로그램 안의 [문제 신고]를 이용해 주세요. <span id="updated"></span></p>
</main>

<script src="data/board.js"></script>
<script>
(function () {
  // 글은 textContent로만 넣는다 (회원이 쓴 글자가 HTML로 해석되지 않게). 주소 링크는 운영자 글과 공식 주소만 받은 기업지원정보(links)에서만 만든다.
  var data = window.SITE_BOARD || {categories: {info: '기업지원정보', improve: '개선의견', free: '자유의견'}, items: []};
  var list = document.getElementById('list'), chips = document.getElementById('chips');
  var current = '', shown = 0, PAGE = 20;

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function fillBody(box, text, links) {
    if (!links) { box.textContent = text; return; }
    text.split(/(https?:\/\/[^\s<>"']+)/).forEach(function (part, i) {
      if (i % 2) {
        var a = el('a', '', part);
        a.href = part; a.target = '_blank'; a.rel = 'noopener noreferrer nofollow';
        box.appendChild(a);
      } else if (part) {
        box.appendChild(document.createTextNode(part));
      }
    });
  }

  function card(item) {
    var d = el('details', 'post'), s = el('summary');
    if (item.id) d.id = 'post-' + item.id;
    s.appendChild(el('span', 'tag ' + item.category, item.category_label));
    s.appendChild(el('span', 'title', item.title));
    s.appendChild(el('span', 'meta', item.author + ' · ' + item.date + (item.answer ? ' · 답변 있음' : '')));
    d.appendChild(s);
    var body = el('div', 'body');
    fillBody(body, item.body, item.links);
    d.appendChild(body);
    if (item.answer) {
      var a = el('div', 'answer');
      a.appendChild(el('b', '', '운영자 답변' + (item.answer_date ? ' · ' + item.answer_date : '')));
      a.appendChild(document.createTextNode(item.answer));
      d.appendChild(a);
    }
    return d;
  }

  function matches() {
    return data.items.filter(function (i) {
      if (current === 'news') return i.category === 'info' && i.author === '운영자';   // 공개 홈 주요 소식과 같은 조건
      return !current || i.category === current;
    });
  }

  function render(openId) {
    list.textContent = '';
    var items = matches();
    if (!items.length) { list.appendChild(el('div', 'empty', '아직 글이 없습니다.')); return; }
    // 글이 쌓여도 화면이 무겁지 않게 나눠 그린다. 열어야 할 글이 뒤에 있으면 거기까지 그린다.
    if (openId) shown = Math.max(shown, items.findIndex(function (i) { return i.id === openId; }) + 1);
    items.slice(0, shown).forEach(function (i) {
      var d = card(i);
      if (i.id === openId) { d.open = true; d.classList.add('focus'); }
      list.appendChild(d);
    });
    if (items.length > shown) {
      var more = el('button', 'more', '더 보기 (' + (items.length - shown) + '건 남음)');
      more.type = 'button';
      more.addEventListener('click', function () { shown += PAGE; render(); });
      list.appendChild(more);
    }
  }

  function setFilter(key, openId) {
    current = key;
    shown = PAGE;
    Array.prototype.forEach.call(chips.children, function (c) {
      c.setAttribute('aria-pressed', c.dataset.key === key ? 'true' : 'false');
    });
    render(openId);
  }

  function chip(key, label) {
    var b = el('button', '', label);
    b.type = 'button';
    b.dataset.key = key;
    b.addEventListener('click', function () { setFilter(key); });
    chips.appendChild(b);
  }

  // 공개 홈 소식 카드에서 오면 #post-글번호, 전체 보기에서 오면 #news
  function fromAddress() {
    var hash = decodeURIComponent(location.hash.slice(1));
    if (hash.indexOf('post-') === 0) {
      var id = hash.slice(5);
      if (data.items.some(function (i) { return i.id === id; })) {
        setFilter('', id);
        var open = list.querySelector('.focus');
        if (open) open.scrollIntoView({block: 'start'});
        return;
      }
    }
    setFilter(hash === 'news' || data.categories[hash] ? hash : '');
  }

  chip('', '전체');
  chip('news', '주요 소식');
  Object.keys(data.categories).forEach(function (k) { chip(k, data.categories[k]); });
  if (data.updated_at) document.getElementById('updated').textContent = '갱신 ' + data.updated_at.slice(0, 10);
  window.addEventListener('hashchange', fromAddress);
  fromAddress();
})();
</script>
</body>
</html>
